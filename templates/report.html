{% extends "base.html" %}{% block content %}<div class="form-card wide"><h1>Report an item</h1><form method="post" enctype="multipart/form-data"><label>Report type</label><select name="report_type" required><option value="LOST">I lost an item</option><option value="FOUND">I found an item</option></select><label>Item name</label><input name="item_name" required><label>Category</label><select name="category" required><option>Electronics</option><option>Books & notes</option><option>Accessories</option><option>Water bottle</option><option>Clothing</option><option>Other</option></select><label>Description (include identifying details)</label><textarea name="description" required></textarea><label>Location</label><input name="location" placeholder="e.g. Library, Block A" required><label>Date</label><input type="date" name="report_date" required><label>Photo (optional, max 5 MB)</label><input type="file" name="photo" accept=".png,.jpg,.jpeg,.webp"><button>Submit report</button></form></div>{% endblock %}
